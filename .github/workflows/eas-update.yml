name: Publish EAS Update

on:
  workflow_dispatch:
    inputs:
      branch:
        description: EAS update branch (preview or production)
        required: true
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: Short release note shown in EAS
        required: true
        type: string
        default: "NexKey update"

permissions:
  contents: read

jobs:
  publish:
    name: Publish EAS OTA update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Publish update
        run: npx eas-cli@latest update --branch "$UPDATE_BRANCH" --message "$RELEASE_MESSAGE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_BRANCH: ${{ inputs.branch }}
          RELEASE_MESSAGE: ${{ inputs.message }}
