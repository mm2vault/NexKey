name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate config plugin syntax
        run: node --check plugins/withNexKeyKeyboard.js
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
      - run: npm run typecheck
